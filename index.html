<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專業數據管理表格</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>專案數據清單</h2>
        
        <div class="table-controls">
            <input type="text" id="searchInput" placeholder="搜尋名稱或職位...">
        </div>

        <div class="table-responsive">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>編號</th>
                        <th>姓名</th>
                        <th>職位</th>
                        <th>部門</th>
                        <th>狀態</th>
                        
                    </tr>
                </thead>
                <tbody id="tableBody">
                    </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
